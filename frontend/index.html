<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141110" />
    <meta
      name="description"
      content="GourMate — the sous-chef on the pass. A hands-free voice cooking assistant."
    />
    <title>GourMate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Geist:wght@400;500&family=Geist+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Resolve the persisted theme before first paint (auto follows prefers-color-scheme).
      try {
        var raw = JSON.parse(localStorage.getItem("gourmate-session-v1") || "{}");
        var theme = (raw && raw.state && raw.state.settings && raw.state.settings.theme) || "auto";
        if (theme === "auto") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {
        document.documentElement.setAttribute(
          "data-theme",
          window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
        );
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
